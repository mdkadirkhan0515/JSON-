name: JSON Syntax Validator

on:
  push:
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Test JSON Syntax
        run: |
          echo "🔍 JSON ফাইলগুলোর সিনট্যাক্স পরীক্ষা করা হচ্ছে..."
          error_found=0
          
          for file in $(find . -name "*.json" -not -path "*/node_modules/*"); do
            if jq '.' "$file" > /dev/null 2>&1; then
              echo "✅ [SUCCESS] $file - সিনট্যাক্স সঠিক আছে।"
            else
              echo "❌ [ERROR] $file - সিনট্যাক্স ভুল আছে!"
              error_found=1
            fi
          done
          
          if [ $error_found -eq 1 ]; then
            echo "⚠️ কিছু JSON ফাইলে গঠনগত ভুল রয়েছে। দয়া করে কমা বা ব্র্যাকেট চেক করুন।"
            exit 1
          fi
          
