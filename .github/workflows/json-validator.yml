name: JSON Syntax Validator

on:
  push:
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate All JSON Files
        run: |
          python3 -c "
          import json, glob, sys

          files = [f for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f and not f.startswith('.github')]

          if not files:
              print('ℹ️ কোনো JSON ফাইল পাওয়া যায়নি।')
              sys.exit(0)

          has_error = False
          print(f'🔍 মোট {len(files)} টি JSON ফাইল চেক করা হচ্ছে...\n')

          for file_path in files:
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      json.load(f)
                  print(f'✅ [SUCCESS] {file_path}')
              except Exception as e:
                  print(f'❌ [ERROR] {file_path} - সিনট্যাক্স ভুল আছে!')
                  print(f'   ভুলের কারণ: {e}\n')
                  has_error = True

          if has_error:
              sys.exit(1)
          "
          
